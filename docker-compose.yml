# Production-style stack: Caddy (automatic HTTPS) -> web (Next.js) -> api (Express + SQLite).
# 1) cp .env.example .env and fill it in (CSRF_SECRET, ROOT_DOMAIN, provider keys...)   2) set DOMAIN / ROOT_DOMAIN below or in .env   3) docker compose up -d --build
# SQLite = ONE api instance only (do not scale `api`). Back up the `codela-data` volume (see `npm run backup` and docs/PRODUCTION.md).
services:
  api:
    build: { context: ., args: { API_URL: "http://api:4000", ROOT_DOMAIN: "${ROOT_DOMAIN:-localhost}" } }
    command: ["npm", "run", "start:api"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_FILE: /app/data/codela.db
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/data/backups
      TRUST_PROXY: "1"            # exactly one proxy hop in front of the api is trusted (the web container)
    volumes: ["codela-data:/app/data"]
    expose: ["4000"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s, timeout: 5s, start_period: 20s, retries: 3 }
  web:
    build: { context: ., args: { API_URL: "http://api:4000", ROOT_DOMAIN: "${ROOT_DOMAIN:-localhost}" } }
    command: ["npm", "run", "start:web"]
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      ROOT_DOMAIN: ${ROOT_DOMAIN:-localhost}
      WEB_HOSTS: ${DOMAIN:-localhost}
      WEB_TRUST_PROXY_HOPS: "1"   # Caddy is the single proxy in front of Next.js
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose: ["3000"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"], interval: 30s, timeout: 5s, start_period: 30s, retries: 3 }
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:-localhost}", ROOT_DOMAIN: "${ROOT_DOMAIN:-localhost}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
volumes: { codela-data: {}, caddy-data: {}, caddy-config: {} }
